name: Windows Package Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned package manager
        shell: pwsh
        run: |
          npm install --global pnpm@12.16.1
          if ($LASTEXITCODE -ne 0) { throw "Package manager installation failed" }
          $version = pnpm --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "12.16.1") { throw "Pinned package manager did not start" }
      - name: Prepare an isolated source tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/windows-package | Out-Null
          git archive --format=tar HEAD --output=.tmp/windows-source.tar
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
          tar -xf .tmp/windows-source.tar -C .tmp/windows-package
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed" }
      - name: Install locked dependencies
        working-directory: .tmp/windows-package
        run: pnpm install --frozen-lockfile
      - name: Check types
        working-directory: .tmp/windows-package
        run: pnpm typecheck
      - name: Lint
        working-directory: .tmp/windows-package
        run: pnpm lint
      - name: Verify post extraction
        working-directory: .tmp/windows-package
        run: pnpm test
      - name: Build the Windows installer
        working-directory: .tmp/windows-package
        run: pnpm make --platform=win32 --arch=x64
      - name: Smoke-test the packaged application
        working-directory: .tmp/windows-package
        run: node test/runtime-smoke.cjs
      - name: Verify the installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem .tmp/windows-package/out/make -Recurse -Filter *.exe)
          if ($installers.Count -eq 0) { throw "Windows installer was not created" }
          if (@($installers | Where-Object Length -eq 0).Count -ne 0) { throw "Windows installer is empty" }
          $installers | Select-Object Name, Length
      - name: Upload the tested installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webpost-scraper-windows-x64
          path: .tmp/windows-package/out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error
      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-diagnostics
          path: .tmp/windows-package/.tmp/runtime-smoke-*
          if-no-files-found: ignore
